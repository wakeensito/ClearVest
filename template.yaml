AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ClearVest backend - one HTTP API, four domain Lambdas (Portfolio, Market,
  Advisor, Voice) plus an SQS history refresh worker, sharing one layer. Spec: docs/superpowers/specs/2026-09-26-backend-architecture-design.md

# SSM parameter NAMES (not values). Hierarchical names go without the leading
# slash (clearvest/fmp), because the ARN and the loader both add it.
Parameters:
  PlaidClientIdParam: {Type: String, Default: clearvest-plaid-client-id}
  PlaidSecretParam: {Type: String, Default: clearvest-plaid-secret}
  PlaidEnv: {Type: String, Default: sandbox, AllowedValues: [sandbox, production]}
  FmpKeyParam: {Type: String, Default: clearvest-fmp}
  AlphaVantageKeyParam: {Type: String, Default: clearvest-alphavantage}
  SecUserAgentParam: {Type: String, Default: clearvest-sec-user-agent}
  ElevenLabsKeyParam: {Type: String, Default: clearvest-elevenlabs}
  ElevenLabsVoiceId: {Type: String, Default: JBFqnCBsd6RMkjVDRZzb}
  ElevenLabsTtsModel: {Type: String, Default: eleven_flash_v2_5}
  ElevenLabsSttModel: {Type: String, Default: scribe_v1}
  # Cross-region inference profile + the foundation model it routes to.
  ModelId: {Type: String, Default: us.amazon.nova-2-lite-v1:0}
  FoundationModelId: {Type: String, Default: amazon.nova-2-lite-v1:0}
  # MarketFn's only Bedrock permission (fund explainer summaries, #42): a cheaper model, scoped
  # separately from ModelId/FoundationModelId so Advisor/Voice can't be swapped by editing this.
  FundModelId: {Type: String, Default: us.amazon.nova-micro-v1:0}
  FundFoundationModelId: {Type: String, Default: amazon.nova-micro-v1:0}

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 15
    Layers: [!Ref SharedLayer]
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        APP_VERSION: '0.1.0'
        LOG_LEVEL: INFO

Resources:
  ClearVestApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # No auth by design (spec §1): throttle to cap Bedrock/ElevenLabs spend.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      # Bedrock and ElevenLabs bill per call: the AI routes get a much tighter cap.
      RouteSettings:
        "ANY /voice/{proxy+}":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        "ANY /advisor/{proxy+}":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [content-type, x-user-id]
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        MaxAge: 600

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-shared'
      ContentUri: src/layer
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-audio, Status: Enabled, ExpirationInDays: 1}
      # Browsers PUT recordings and GET speech via presigned URLs.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ['*']
            MaxAge: 600

  PortfolioFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/portfolio
      Handler: portfolio.app.handler
      # Plaid sandbox item creation can take 10-20s, and /plaid/sandbox-link makes three calls in a
      # row; each Plaid call's timeout follows the remaining time. API Gateway stops waiting at 30s.
      Timeout: 29
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: portfolio
          PLAID_ENV: !Ref PlaidEnv
          PLAID_CLIENT_ID_PARAM: !Ref PlaidClientIdParam
          PLAID_SECRET_PARAM: !Ref PlaidSecretParam
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${PlaidClientIdParam}'
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${PlaidSecretParam}'
      Events:
        Health: {Type: HttpApi, Properties: {ApiId: !Ref ClearVestApi, Path: /health, Method: GET}}
        Profile: {Type: HttpApi, Properties: {ApiId: !Ref ClearVestApi, Path: /profile, Method: ANY}}
        Plaid: {Type: HttpApi, Properties: {ApiId: !Ref ClearVestApi, Path: '/plaid/{proxy+}', Method: ANY}}
        Portfolio: {Type: HttpApi, Properties: {ApiId: !Ref ClearVestApi, Path: '/portfolio/{proxy+}', Method: ANY}}

  MarketFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/market
      Handler: market.app.handler
      MemorySize: 1024  # yfinance pulls in pandas
      # Comparisons/research still fetch providers synchronously. History only reads
      # snapshots and submits SQS jobs; its provider calls run in MarketRefreshFn.
      Timeout: 29
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: market
          MARKET_REFRESH_QUEUE_URL: !Ref MarketRefreshQueue
          FMP_KEY_PARAM: !Ref FmpKeyParam
          ALPHAVANTAGE_KEY_PARAM: !Ref AlphaVantageKeyParam
          SEC_USER_AGENT_PARAM: !Ref SecUserAgentParam
          FUND_MODEL_ID: !Ref FundModelId
          # One attempt, short read timeout: a fund summary always has a template fallback, so a
          # slow/throttled Bedrock call should fail fast rather than eat into the 29s budget.
          BEDROCK_MAX_ATTEMPTS: '1'
          BEDROCK_READ_TIMEOUT: '6'
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - SQSSendMessagePolicy: {QueueName: !GetAtt MarketRefreshQueue.QueueName}
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${FmpKeyParam}'
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AlphaVantageKeyParam}'
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SecUserAgentParam}'
            # Fund explainer summaries only (#42): scoped to Nova Micro, never the Advisor/Voice model.
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${FundModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/${FundFoundationModelId}'
      Events:
        Market: {Type: HttpApi, Properties: {ApiId: !Ref ClearVestApi, Path: '/market/{proxy+}', Method: ANY}}

  MarketRefreshDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-market-refresh-dlq'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  MarketRefreshQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-market-refresh'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 3600
      VisibilityTimeout: 360  # six times the worker's 60-second timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MarketRefreshDeadLetterQueue.Arn
        maxReceiveCount: 5  # keep aligned with history_refresh.MAX_RECEIVES

  MarketRefreshFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/market
      Handler: market.refresh_worker.handler
      MemorySize: 1024
      Timeout: 60
      # No ReservedConcurrentExecutions: this account's Lambda limit is 10 and Lambda keeps 10
      # unreserved, so reserving any amount fails the deploy. The SQS event's ScalingConfig caps
      # the worker at 2 concurrent runs instead.
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: market-refresh
          FMP_KEY_PARAM: !Ref FmpKeyParam
          ALPHAVANTAGE_KEY_PARAM: !Ref AlphaVantageKeyParam
      Policies:
        # The worker cannot read user profiles, chat, or Plaid tokens.
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt Table.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['CACHE#history', 'REFRESH#history#*']
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${FmpKeyParam}'
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AlphaVantageKeyParam}'
        - SQSPollerPolicy: {QueueName: !GetAtt MarketRefreshQueue.QueueName}
      Events:
        Refresh:
          Type: SQS
          Properties:
            Queue: !GetAtt MarketRefreshQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: {MaximumConcurrency: 2}

  MarketRefreshDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-market-refresh-dlq'
      AlarmDescription: History refresh jobs exhausted retries; inspect the DLQ and provider logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt MarketRefreshDeadLetterQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  MarketRefreshAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-market-refresh-age'
      AlarmDescription: History refresh backlog exceeds five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt MarketRefreshQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AdvisorGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: clearvest-advisor
      Description: Beginner finance education boundaries and personal identifier masking
      BlockedInputMessaging: I can explain investing risks, but cannot help with illegal financial activity or choose trades for you.
      BlockedOutputsMessaging: I cannot provide that recommendation. I can explain diversification and investment risk instead.
      Tags: [{Key: clearvest-stack, Value: !Ref 'AWS::StackName'}]
      TopicPolicyConfig:
        TopicsConfig:
          - Name: SpecificTradingRecommendations
            Type: DENY
            InputEnabled: false
            OutputEnabled: true
            Definition: Recommendations instructing a person to buy, sell, hold, short, or allocate a specific amount to a named security, token, or derivative. Excludes neutral explanations of holdings, investment concepts, and refusals to recommend trades.
            Examples: ['Buy NVDA with your savings today.', 'Sell all your AAPL shares.', 'Put 80 percent of your emergency fund into Bitcoin.']
          - Name: GuaranteedInvestmentReturns
            Type: DENY
            InputEnabled: false
            OutputEnabled: true
            Definition: Claims that an investment guarantees a profit, a particular future return, or cannot lose money. Excludes warnings that returns are not guaranteed and explanations of investment risk.
            Examples: ['This stock will definitely double your money.', 'You cannot lose with this investment.']
          - Name: IllegalFinancialConduct
            Type: DENY
            Definition: Instructions facilitating insider trading, securities fraud, market manipulation, money laundering, or tax evasion. Excludes general education about why these activities are illegal and how to avoid them.
            Examples: ['Tell me how to hide insider trades.', 'Help me manipulate a stock price without getting caught.']
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - {Type: EMAIL, Action: ANONYMIZE}
          - {Type: PHONE, Action: ANONYMIZE}
          - {Type: NAME, Action: ANONYMIZE}
          - {Type: ADDRESS, Action: ANONYMIZE}
          - {Type: US_SOCIAL_SECURITY_NUMBER, Action: ANONYMIZE}
          - {Type: US_BANK_ACCOUNT_NUMBER, Action: ANONYMIZE}
          - {Type: CREDIT_DEBIT_CARD_NUMBER, Action: ANONYMIZE}
          - {Type: CREDIT_DEBIT_CARD_CVV, Action: ANONYMIZE}
          - {Type: PASSWORD, Action: ANONYMIZE}
          - {Type: AWS_ACCESS_KEY, Action: ANONYMIZE}
          - {Type: AWS_SECRET_KEY, Action: ANONYMIZE}
      ContentPolicyConfig:
        FiltersConfig:
          - {Type: HATE, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: SEXUAL, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: VIOLENCE, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: INSULTS, InputStrength: MEDIUM, OutputStrength: MEDIUM}
          - {Type: MISCONDUCT, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE}

  AdvisorGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt AdvisorGuardrail.GuardrailId
      # Bump this description whenever its policy changes: replacement publishes a new snapshot.
      Description: advisor-policy-v1

  PortfolioGroundingGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: clearvest-portfolio-grounding
      Description: Standalone source QA for portfolios, scenarios, companies and lessons, never conversational history
      BlockedInputMessaging: A portfolio reference is required.
      BlockedOutputsMessaging: This explanation could not be verified against the supplied portfolio facts.
      Tags: [{Key: clearvest-stack, Value: !Ref 'AWS::StackName'}]
      ContextualGroundingPolicyConfig:
        FiltersConfig:
          - {Type: GROUNDING, Threshold: 0.75}
          - {Type: RELEVANCE, Threshold: 0.75}

  PortfolioGroundingGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt PortfolioGroundingGuardrail.GuardrailId
      Description: source-grounding-v2

  AdvisorFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/advisor
      Handler: advisor.app.handler
      Timeout: 29  # API Gateway stops waiting at 30s
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: advisor
          GROUNDING_GUARDRAIL_ID: !GetAtt PortfolioGroundingGuardrail.GuardrailId
          GROUNDING_GUARDRAIL_VERSION: !GetAtt PortfolioGroundingGuardrailVersion.Version
          BEDROCK_MAX_ATTEMPTS: '1'
          BEDROCK_READ_TIMEOUT: '8'
          MODEL_ID: !Ref ModelId
          ADVISOR_GUARDRAIL_ID: !GetAtt AdvisorGuardrail.GuardrailId
          ADVISOR_GUARDRAIL_VERSION: !GetAtt AdvisorGuardrailVersion.Version
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Condition:
                StringEquals:
                  bedrock:GuardrailIdentifier: !Sub '${AdvisorGuardrail.GuardrailArn}:${AdvisorGuardrailVersion.Version}'
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}'
                # A us.* profile routes to any US region, so the model ARN needs a region wildcard.
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/${FoundationModelId}'
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: [!GetAtt AdvisorGuardrail.GuardrailArn, !GetAtt PortfolioGroundingGuardrail.GuardrailArn]
      Events:
        Advisor: {Type: HttpApi, Properties: {ApiId: !Ref ClearVestApi, Path: '/advisor/{proxy+}', Method: ANY}}

  VoiceFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/voice
      Handler: voice.app.handler
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: voice
          MODEL_ID: !Ref ModelId
          ADVISOR_GUARDRAIL_ID: !GetAtt AdvisorGuardrail.GuardrailId
          ADVISOR_GUARDRAIL_VERSION: !GetAtt AdvisorGuardrailVersion.Version
          BEDROCK_MAX_ATTEMPTS: '1'
          BEDROCK_READ_TIMEOUT: '7'
          AUDIO_BUCKET: !Ref AudioBucket
          ELEVENLABS_KEY_PARAM: !Ref ElevenLabsKeyParam
          ELEVENLABS_VOICE_ID: !Ref ElevenLabsVoiceId
          ELEVENLABS_TTS_MODEL: !Ref ElevenLabsTtsModel
          ELEVENLABS_STT_MODEL: !Ref ElevenLabsSttModel
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - S3CrudPolicy: {BucketName: !Ref AudioBucket}
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ElevenLabsKeyParam}'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Condition:
                StringEquals:
                  bedrock:GuardrailIdentifier: !Sub '${AdvisorGuardrail.GuardrailArn}:${AdvisorGuardrailVersion.Version}'
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/${FoundationModelId}'
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !GetAtt AdvisorGuardrail.GuardrailArn
      Events:
        Voice: {Type: HttpApi, Properties: {ApiId: !Ref ClearVestApi, Path: '/voice/{proxy+}', Method: ANY}}

  # --- Frontend hosting: private S3 bucket behind CloudFront (Origin Access Control) ---
  # No BucketName: CloudFormation generates a lowercase clearvest-frontendbucket-* name,
  # which the CD role's ${AppBucketPrefix}-* statements already cover.
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        Description: CloudFront signs every request to the private frontend bucket
        OriginAccessControlOriginType: s3
        SigningProtocol: sigv4
        SigningBehavior: always

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      # Ownership tag: the CD role may only update/delete/untag distributions that
      # carry it (this account hosts other sites' distributions). Never remove it.
      Tags:
        - Key: clearvest:managed-by
          Value: clearvest-cicd
      DistributionConfig:
        Comment: !Sub '${AWS::StackName} frontend'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        IPV6Enabled: true
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            # Empty OAI is required alongside OAC on an S3 origin.
            S3OriginConfig: {OriginAccessIdentity: ''}
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # AWS managed "CachingOptimized" cache policy. This UUID is the same in every
          # AWS account (a global managed-policy ID), not account data.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # AWS managed "SecurityHeadersPolicy" response headers policy (HSTS, nosniff,
          # frame-options, referrer-policy, XSS). Global managed-policy ID, not account data.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # SPA fallback: client-side routes (/markets, /learn...) are not S3 keys. A private
        # bucket answers a missing key with 403 (404 only if the caller may ListBucket), so
        # both map to index.html with 200 and the router takes over. TTL 0 so a real
        # missing file is never cached as the app shell for long.
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}

  # Only this distribution (via OAC) can read objects; the bucket stays fully private.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  MarketRefreshQueueUrl:
    Value: !Ref MarketRefreshQueue
  MarketRefreshDeadLetterQueueUrl:
    Value: !Ref MarketRefreshDeadLetterQueue
  ApiUrl:
    Description: Base URL for the frontend
    Value: !Sub 'https://${ClearVestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  TableName:
    Value: !Ref Table
  AudioBucketName:
    Value: !Ref AudioBucket
  FrontendUrl:
    Description: Public URL of the hosted frontend (CloudFront)
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Description: Private bucket CD syncs the Vite build into
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution CD invalidates after each sync
    Value: !Ref FrontendDistribution
