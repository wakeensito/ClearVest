# Dependabot version updates — https://docs.github.com/en/code-security/dependabot
#
# Weekly, with minor + patch bumps grouped into one PR so updates don't turn
# into a firehose. Major bumps arrive as their own PR — those deserve
# individual review.
#
# NOTE: an ecosystem listed here WITHOUT a manifest in the repo produces a
# red "Dependabot Updates" run every week (verified — it is not silently
# inert). Add an ecosystem only once its manifest exists.
version: 2
updates:
  # Root package.json is an npm workspace; this covers frontend/ through the root lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint and openapi-typescript don't support TypeScript 6+ yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # react-router 8 requires Node >= 22.22; bump together with the team's Node version.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # The workflow files themselves (actions/checkout, setup-node,
  # configure-aws-credentials). All bumps grouped, majors included — action
  # majors are routine runtime updates, and CI proves them on the PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
