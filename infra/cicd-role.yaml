AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  GitHub Actions OIDC deploy role for ClearVest — the one bootstrap
  piece, applied once from a laptop:
    aws cloudformation deploy --template-file infra/cicd-role.yaml \
      --stack-name ClearVest-cicd --capabilities CAPABILITY_NAMED_IAM
  Then: gh variable set AWS_DEPLOY_ROLE_ARN --body "<DeployRoleArn output>".
  CloudFormation, not Terraform, on purpose: state lives server-side in the
  stack (no local tfstate to lose) and it's one toolchain with SAM stacks.
  Every ARN is built from pseudo-parameters — no account ID in the repo.
  Never static AWS keys; OIDC role assumption only.

Parameters:
  GitHubRepo:
    Type: String
    Default: wakeensito/ClearVest
    Description: repo allowed to assume the role (owner/name)
  AppStackName:
    Type: String
    Default: ClearVest
    Description: the CloudFormation/SAM stack this role deploys
  AppBucketPrefix:
    Type: String
    Default: clearvest
    Description: Lowercase stack name. CloudFormation lowercases generated S3 bucket names.

Resources:
  # Assumes the account already has the GitHub OIDC provider
  # (token.actions.githubusercontent.com). If not, create it once:
  #   aws iam create-open-id-connect-provider \
  #     --url https://token.actions.githubusercontent.com \
  #     --client-id-list sts.amazonaws.com
  DeployRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3037
    Properties:
      RoleName: !Sub '${AppStackName}-gha-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # BOTH subject shapes, learned the hard way: classic
                # "repo:owner/name:..." AND GitHub's ID-stamped
                # "repo:owner@id/name@id:..." — accounts with the newer
                # format never match the classic pattern alone, and the
                # failure is an opaque "Not authorized" at assume time.
                # Both are pinned to main: PR/feature branches can no longer
                # assume this role, so CD runs only from main (a push, or
                # `gh workflow run deploy.yml --ref main`). StringLike stays
                # for the @* wildcards in the ID-stamped shape.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
                  - !Sub
                    - 'repo:${Owner}@*/${Name}@*:ref:refs/heads/main'
                    - Owner: !Select [0, !Split ['/', !Ref GitHubRepo]]
                      Name: !Select [1, !Split ['/', !Ref GitHubRepo]]
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Drive the app stack's CloudFormation lifecycle.
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  # Also used by deploy.yml to read the stack's outputs (ApiUrl, Frontend*).
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
                  # SAM's resolve_s3 manages its artifact bucket via this
                  # stack and touches it on every deploy.
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
              # SAM's transform is a managed CFN "resource".
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: SamArtifacts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:PutBucketPolicy
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketVersioning
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default*'
              # App resources, all scoped to the stack's naming prefix.
              # EXTEND per stack: add statements for whatever the app
              # template actually creates (SNS, SQS, CloudFront, etc.) —
              # scoped by the ${AppStackName}-* prefix, never '*'.
              - Sid: AppResources
                Effect: Allow
                Action:
                  - lambda:*
                  - scheduler:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*'
                  - !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${AppStackName}-*'
                  - !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default'
              - Sid: AppTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeContinuousBackups
                  # CloudFormation's DynamoDB handler reads these on every create/update.
                  - dynamodb:DescribeContributorInsights
                  - dynamodb:DescribeKinesisStreamingDestination
                  - dynamodb:GetResourcePolicy
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*'
              # Execution roles the app stack creates for its functions.
              - Sid: AppRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*'
              # HTTP API. API Gateway ARNs carry no name, so this can't be scoped by
              # prefix; it is limited to the apis/tags paths in this region.
              # apigateway:TagResource/UntagResource ARE real, required IAM actions —
              # ApiGatewayV2's Stage resource handler calls them directly on create/
              # update/delete (separately from the apigateway:PUT-on-/tags/* path).
              # cfn-lint's action database is stale and doesn't know about them
              # (flags as W3037); that's a lint gap, not evidence the action is fake.
              - Sid: AppHttpApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*'
                  - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
              - Sid: AppLayers
                Effect: Allow
                Action:
                  - lambda:PublishLayerVersion
                  - lambda:DeleteLayerVersion
                  - lambda:GetLayerVersion
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:${AppStackName}-*'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:${AppStackName}-*:*'
              - Sid: AppBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:PutBucketCORS
                  - s3:GetBucketCORS
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  # Read during create/update/delete of the bucket by CloudFormation's S3 handler.
                  - s3:ListBucket
                  - s3:GetBucketAcl
                  # Frontend bucket: CloudFront-only bucket policy + BucketOwnerEnforced.
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketOwnershipControls
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppBucketPrefix}-*'
              # CD syncs the Vite build into the frontend bucket (sync --delete needs
              # ListBucket). Objects only in the generated clearvest-frontendbucket-* bucket.
              - Sid: AppFrontendObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${AppBucketPrefix}-frontendbucket-*/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${AppBucketPrefix}-frontendbucket-*'
              # Frontend CDN. CloudFront distribution and OAC IDs are random (E2ABC...),
              # never derived from the stack name, so they can't be prefix-scoped like
              # the resources above; they are limited to this account's distributions
              # and OACs. CloudFront is global, so the ARNs have no region.
              # Create actions support NO resource-level permissions (no resource type in
              # the Service Authorization Reference): scoped to distribution/* or
              # origin-access-control/* they are implicitly denied, so '*' is required.
              - Sid: AppCloudFrontCreate
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateDistributionWithTags
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:CreateConnectionGroup
                Resource: '*'
              # Read-only lookups the AWS::CloudFront::Distribution create/update handler
              # declares in the CloudFormation registry; unused features here, but a
              # missing permission fails the handler.
              - Sid: AppCloudFrontHandlerReads
                Effect: Allow
                Action:
                  - cloudfront:GetConnectionGroup
                  - cloudfront:GetVpcOrigin
                Resource: '*'
              - Sid: AppCloudFront
                Effect: Allow
                Action:
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateDistributionWithStagingConfig
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
              - Sid: AppCloudFrontOAC
                Effect: Allow
                Action:
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*'
              # The distribution references AWS managed cache/response-headers policies
              # (CachingOptimized, SecurityHeadersPolicy); they are read at create/update.
              - Sid: AppCloudFrontManagedPolicies
                Effect: Allow
                Action:
                  - cloudfront:GetCachePolicy
                  - cloudfront:GetResponseHeadersPolicy
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:cache-policy/*'
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*'

Outputs:
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN repo variable
    Value: !GetAtt DeployRole.Arn
