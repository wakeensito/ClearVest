# CI — stack-detecting quality gate. The ONE required status check is `ci-ok`.
#
# The repo starts as DevOps-only scaffolding; the node/python jobs activate
# automatically once a package.json / pyproject.toml / requirements.txt lands.
# Branch protection requires only `ci-ok` (an if: always() aggregator) because
# requiring skippable jobs directly is brittle: a renamed or never-triggered
# job leaves the check "expected" forever and blocks every merge.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Supersede runs on the same ref — a rebased PR shouldn't burn two runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      node: ${{ steps.d.outputs.node }}
      node_lock: ${{ steps.d.outputs.node_lock }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        run: |
          echo "node=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "node_lock=$([ -f package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          { [ -f pyproject.toml ] || [ -f requirements.txt ]; } \
            && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # cache only when a lockfile exists — setup-node errors otherwise
          cache: ${{ needs.detect.outputs.node_lock == 'true' && 'npm' || '' }}
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Pinned: CI must not drift ahead of local tooling — the first
          # launch got 6 surprise findings from an unpinned newer ruff.
          # Bump deliberately, run the new version locally first.
          pip install "ruff==0.16.5" pytest
      - run: ruff check .
      - name: Tests
        # pytest exits 5 when no tests are collected — tolerated while the
        # suite is empty so scaffolded repos stay green.
        run: pytest -q || { rc=$?; [ "$rc" -eq 5 ] && echo "no tests yet"; [ "$rc" -eq 5 ]; }

  security:
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API — on PRIVATE repos that needs
    # pull-requests:read, or it dies with 403 "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the diff
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # license-free on personal-account repos
      - name: Vulnerability scan (trivy)
        # fs mode covers npm and pip lockfiles in one stack-agnostic pass.
        # Pinned tag, never @master — unpinned actions are a supply-chain hole.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # The single required check for branch protection. Green when every
  # dependency either succeeded or was skipped (stack not present yet).
  ci-ok:
    needs: [detect, node, python, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(join(needs.*.result, ','), 'failure') }}" = "false" ] \
            && [ "${{ contains(join(needs.*.result, ','), 'cancelled') }}" = "false" ]
